/* drag-resize-v1: JS-driven edge/corner detection (works despite rounded clip) */
const MIN_W=160,MIN_H=120;
const EDGE=14,CORNER=18;
let dragging=false,resizing=null,dragStart=null,edgeDir=null;
function setGeom(g){frame.style.left=g.x+'px';frame.style.top=g.y+'px';frame.style.width=g.w+'px';frame.style.height=g.h+'px'}
function initGeom(){
  let g=null;
  try{if(settings.geom&&settings.geom.w)g=settings.geom}catch(_){}
  if(!g){const W=window.innerWidth,H=window.innerHeight;g={x:0,y:0,w:Math.round(W*0.25),h:Math.round(H*0.45)}}
  setGeom(g);
}
function geomNow(){const r=frame.getBoundingClientRect();return{x:Math.round(r.left),y:Math.round(r.top),w:Math.round(r.width),h:Math.round(r.height)}}
function saveGeom(){try{settings.geom=geomNow();localStorage.setItem(key,JSON.stringify(settings))}catch(_){}}
function dirAt(px,py){
  const r=frame.getBoundingClientRect(),lx=px-r.left,ly=py-r.top;
  const nearW=(lx<=EDGE),nearE=((r.width-lx)<=EDGE),nearT=(ly<=EDGE),nearB=((r.height-ly)<=EDGE);
  if(nearW&&nearT)return'nw';if(nearE&&nearT)return'ne';if(nearW&&nearB)return'sw';if(nearE&&nearB)return'se';
  let d='';
  if(nearT)d+='n';if(nearB)d+='s';if(nearW)d+='w';if(nearE)d+='e';
  return d||null;
}
initGeom();
frame.addEventListener('pointermove',e=>{
  if(dragging||resizing)return;
  edgeDir=dirAt(e.clientX,e.clientY);
  frame.dataset.rz=edgeDir||'';
  frame.style.cursor=edgeDir
    ?(edgeDir.length===2
      ?((edgeDir==='nw'||edgeDir==='se')?'nwse-resize':'nesw-resize')
      :(edgeDir==='n'||edgeDir==='s')?'ns-resize':(edgeDir==='w'||edgeDir==='e')?'ew-resize':'grab')
    :'grab';
});
frame.addEventListener('pointerleave',()=>{if(!dragging&&!resizing){frame.dataset.rz='';frame.style.cursor='grab';edgeDir=null}});
frame.addEventListener('pointerdown',e=>{
  if(e.target.closest('#panel')||e.target.closest('#settings'))return;
  const d=dirAt(e.clientX,e.clientY);
  dragStart={mx:e.clientX,my:e.clientY,g:geomNow()};
  if(d){resizing=d;frame.style.cursor='grabbing'}
  else{dragging=true;frame.classList.add('dragging');frame.style.cursor='grabbing'}

});
window.addEventListener('pointermove',e=>{
  if(!dragging&&!resizing)return;
  if(!dragStart)return;
  if(dragging){
    setGeom({x:dragStart.g.x+(e.clientX-dragStart.mx),y:dragStart.g.y+(e.clientY-dragStart.my),w:dragStart.g.w,h:dragStart.g.h});
  }else{
    const g=dragStart.g,dx=e.clientX-dragStart.mx,dy=e.clientY-dragStart.my;
    let{x,y,w,h}=g;
    if(resizing.includes('e'))w=g.w+dx;
    if(resizing.includes('s'))h=g.h+dy;
    if(resizing.includes('w')){x=g.x+dx;w=g.w-dx}
    if(resizing.includes('n')){y=g.y+dy;h=g.h-dy}
    if(w<MIN_W){if(resizing.includes('w'))x-=(MIN_W-w);w=MIN_W}
    if(h<MIN_H){if(resizing.includes('n'))y-=(MIN_H-h);h=MIN_H}
    setGeom({x,y,w,h});
  }
});
window.addEventListener('pointerup',()=>{
  if(dragging||resizing){dragging=false;dragStart=null;frame.classList.remove('dragging');frame.style.cursor='grab';resizing=null;saveGeom();}
});

function save(){try{localStorage.setItem(key,JSON.stringify({camera:$('camera').value,gift:$('gift').value,hide:$('hide').checked,preset:$('preset').value,bright:$('bright').value,contrast:$('contrast').value,shape:$('shape').value,border:$('border').value,glow:$('glow').value,mirror:$('mirror').checked}))}catch(_){}}
function apply(){const filters={none:'',cinema:'saturate(1.18) contrast(1.12)',mono:'grayscale(1)',warm:'sepia(.22) saturate(1.2)',cool:'hue-rotate(12deg)',vivid:'saturate(1.5) contrast(1.08)'};video.style.setProperty('--filter',[filters[$('preset').value],`brightness(${$('bright').value}%)`,`contrast(${$('contrast').value}%)`].join(' '));video.style.setProperty('--mirror',$('mirror').checked?'-1':'1');frame.style.setProperty('--bw',$('border').value+'px');frame.style.setProperty('--glow',$('glow').value+'px');frame.style.borderRadius=$('shape').value==='square'?'0':$('shape').value==='circle'?'50%':'24px';$('bval').textContent=$('bright').value+'%';$('cval').textContent=$('contrast').value+'%';$('gval').textContent=$('glow').value+' px';save()}
function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;$('placeholder').style.display='grid'}
function shatterCam(){
  if(!stream||!video.videoWidth){status.textContent='Камера не активна';return}
  const g=$('shatter-grid');g.innerHTML='';
  const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;
  const ctx=c.getContext('2d');ctx.drawImage(video,0,0);
  const d=ctx.getImageData(0,0,c.width,c.height);const p=d.data;
  const fs=10;const cols=Math.ceil(c.width/fs),rows=Math.ceil(c.height/fs);
  for(let r=0;r<rows;r++){for(let col=0;col<cols;col++){
    const ix=(r*c.width+col)*4;const R=p[ix],G=p[ix+1],B=p[ix+2],A=p[ix+3];
    if(A>30){
      const e=document.createElement('div');e.className='shard';
      e.style.left=col*fs+'px';e.style.top=r*fs+'px';e.style.width=fs+'px';e.style.height=fs+'px';
      e.style.backgroundColor='rgba('+R+','+G+','+B+',0.8)';
      const tx=(Math.random()-0.5)*400;const ty=(Math.random()-0.5)*400+200;
      const rot=(Math.random()-0.5)*360;const sc=0.5+Math.random();
      e.style.setProperty('--tx',tx+'px');e.style.setProperty('--ty',ty+'px');
      e.style.setProperty('--r',rot+'deg');e.style.setProperty('--s',sc);
      e.style.animation='shatter-fall '+(1.5+Math.random()*1.5)+'s cubic-bezier(0.4,0,0.2,1) forwards';
      g.appendChild(e)
    }
  }}
  status.textContent='Камеру разбито на '+((cols*rows)*0.6|0)+' осколков';
  setTimeout(()=>{g.innerHTML='';status.textContent='Камера восстановлена'},5000)
}

async function start(){if(!navigator.mediaDevices?.getUserMedia){status.textContent='Нет доступа к камере: открой через HTTPS/localhost либо добавь камеру отдельно в OBS.';return}stop();try{stream=await navigator.mediaDevices.getUserMedia({video:$('camera').value?{deviceId:{exact:$('camera').value}}:{width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;$('placeholder').style.display='none';await devices();status.textContent='Камера подключена.';save()}catch(e){status.textContent='Камера: '+e.message}}
  function hook(){const layer=$('hook-layer'),hookEl=$('pudge-hook');clearTimeout(timer);layer.classList.remove('active');frame.classList.remove('hooked');hookEl.style.animation='';hookEl.style.left='';hookEl.style.bottom='';hookEl.style.transform='';void layer.offsetWidth;void hookEl.offsetWidth;layer.style.display='block';layer.classList.add('active');frame.classList.add('hooked');status.textContent='Хук Пуджа из Dota 2!';const fb=document.getElementById('hook-fallback');if(fb)fb.style.opacity='1';timer=setTimeout(()=>{layer.classList.remove('active');layer.style.display='none';frame.classList.remove('hooked');hookEl.style.animation='none';hookEl.style.left='-450px';hookEl.style.bottom='70px';hookEl.style.transform='';if(fb)fb.style.opacity='0';},1950)}
function matches(n){const t=$('gift').value.trim().toLocaleLowerCase('ru');return !!t&&String(n||'').toLocaleLowerCase('ru').includes(t)}const ch=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('tiktok_gifts'):null;if(ch)ch.onmessage=e=>{const d=e.data||{};if(matches(d.gift||d.giftName||d.name))hook()};window.addEventListener('storage',e=>{if(e.key==='dota2obs:pudge-hook'&&e.newValue)try{const d=JSON.parse(e.newValue);if(Date.now()-d.at<5000&&matches(d.gift))hook()}catch(_){}});
for(const id of ['preset','bright','contrast','shape','border','glow','mirror'])$(id).addEventListener('input',apply);$('gift').addEventListener('input',save);$('start').addEventListener('click',start);$('test').addEventListener('click',hook);$('shatter').addEventListener('click',shatterCam);$('camera').addEventListener('change',()=>{save();if(stream)start()});$('hide').addEventListener('change',()=>{document.body.classList.toggle('no-ui',$('hide').checked);save()});$('settings').addEventListener('click',()=>{document.body.classList.remove('no-ui');$('hide').checked=false;save()});for(const id of ['gift','bright','contrast','shape','border','glow','mirror','preset','camera'])if(settings[id]!=null)$(id).value=settings[id];if(settings.hide){$('hide').checked=true;document.body.classList.add('no-ui')}if(q.get('controls')==='0'){document.body.classList.add('no-ui');$('hide').checked=true}apply();devices().catch(()=>{});if(settings.cameraEnabled||q.get('controls')==='0')start()})();
</script>

    model.rotation.set(-Math.PI/2.5, Math.PI/4, Math.PI/2.4); // поставить крюк вертикально и чуть повернуть к зрителю
    // 3D цепь, прикреплённая к кольцу (левая сторона хука), тянется влево
    // цепь рисуется отдельно (CSS/JS) между хуком и нижним левым углом
    scene.add(model);
    container._model = model;
  }, undefined, (err) => {
    console.error('GLB load error', err);
    const fb = document.getElementById('hook-fallback');
    if (fb) fb.style.opacity = '1';
  });

  camera.position.set(0, 0, 5.5);
  camera.lookAt(0, 0, 0);


const tether = document.getElementById('pudge-tether');
  const tetherFb = document.getElementById('tether-fallback');
  const layer = document.getElementById('hook-layer');
  const hookEl = document.getElementById('pudge-hook');
  function updateTether() {
    if (!layer.classList.contains('active')) { tether.style.display='none'; if(tetherFb)tetherFb.style.display='none'; return; }
    if (!hookEl) { tether.style.display='none'; if(tetherFb)tetherFb.style.display='none'; return; }
    const r = hookEl.getBoundingClientRect();
    const hx = r.left + r.width * 0.38;
    const hy = r.top + r.height * 0.03;
    const ax = 0, ay = window.innerHeight;
    const dx = hx - ax, dy = hy - ay;
    const len = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    tether.style.display = 'block';
    tether.style.width = len + 'px';
    tether.style.transform = 'rotate(' + ang + 'deg)';
    if (tetherFb) {
      tetherFb.style.display = 'block';
      tetherFb.style.width = len + 'px';
      tetherFb.style.transform = 'rotate(' + ang + 'deg)';
    }
    console.log('[tether] len:', len, 'ang:', ang, 'hx/hy:', hx, hy, 'hookRect:', r.left, r.top, r.width, r.height);
  }
  function tetherLoop() { updateTether(); requestAnimationFrame(tetherLoop); }
  tetherLoop();

  function animate() {
    requestAnimationFrame(animate);
    const m = container._model;
    // статичная модель, без вращения
    renderer.render(scene, camera);
  }
  animate();

  const ro = new ResizeObserver(() => {
    const nw = container.clientWidth;
    const nh = container.clientHeight;
    if (nw && nh) {
      camera.aspect = nw / nh;
      camera.updateProjectionMatrix();
      renderer.setSize(nw, nh);
    }
  });
  ro.observe(container);
}

window.addEventListener('DOMContentLoaded', initHook3D);
</script>
