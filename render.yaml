services:
  - type: web
    name: fissure-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: "INFO"
      - key: MAX_CONNECTIONS
        value: "20"
      - key: MIN_CONNECTIONS
        value: "5"
    healthCheckPath: "/health"
    healthCheckInterval: 30
    healthCheckTimeout: 10
    healthCheckRetries: 3
    healthCheckGracePeriod: 120
    env:
      - key: DATABASE_URL
        fromDatabase:
          name: fissure-db
          property: connectionString
  - type: postgres
    name: fissure-db
    databaseName: fissure
    databaseUser: fissure
    version: "18"
    envVars:
      - key: POSTGRES_DB
        value: fissure
      - key: POSTGRES_USER
        value: fissure
      - key: POSTGRES_PASSWORD
        generateValue: true
    backupRetentionDays: 30
    backupSchedule: "0 2 * * *"
