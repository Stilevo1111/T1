services:
  - type: web
    name: fissure-bot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        fromSecret: BOT_TOKEN
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: WEBHOOK_URL
        value: https://fissure-bot.onrender.com/webhook
      - key: BOT_NAME
        value: fissure_bot
      - key: RENDER_SERVICE_NAME
        value: fissure-bot
      - key: RENDER_REGION
        value: oregon
    healthCheckPath: /health
    healthCheckInterval: 60
    healthCheckTimeout: 10
    healthCheckRetries: 3