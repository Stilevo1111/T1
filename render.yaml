services:
  - type: web
    name: fissure-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PORT
        value: "10000"
  - type: postgres
    name: fissure-db
    databaseName: fissure
    databaseUser: fissure
    version: "18"
