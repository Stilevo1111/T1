<title>Веб-камера — OBS</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<style>
  :root { color-scheme: dark; --accent: #5dd6c0; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body { font-family: Inter, "Segoe UI", Arial, sans-serif; color: #f4f6fb; }
  /* ─── Контейнер 1080×1920 (вертикальный формат). Фиксированный внутренний размер —
        вся компоновка и анимация хука считается в одних координатах; при размерах
        источника OBS, отличных от 9:16, контейнер вписывается с сохранением пропорций. ─── */
  #container { position: absolute; width: 1080px; height: 1920px; transform-origin: center center; left: 50%; top: 50%; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  #camera-frame { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: var(--radius, 18px); border: var(--border-width, 0px) solid var(--border-color, #5dd6c0); box-shadow: 0 0 var(--glow, 0px) var(--glow-color, #5dd6c0); background: transparent; transition: border-radius .2s, filter .2s, box-shadow .2s; }
  #hook-layer { position: absolute; inset: 0; overflow: visible; pointer-events: none; z-index: 5; perspective: 900px; visibility: hidden; }
  #hook-layer.active { visibility: visible; }


  #hook3d, #hook3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #camera-frame.circle { width: min(80vw, 80vh); height: min(80vw, 80vh); border-radius: 50%; }
  #camera-frame.square { border-radius: 0; }
  #camera-frame.rounded { border-radius: 24px; }
  #video { width: 100%; height: 100%; display: block; object-fit: cover; transform: scaleX(var(--mirror, 1)); filter: var(--video-filter, none); }
  #placeholder { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #c1c6d4; background: rgba(16, 18, 25, .82); font-size: 15px; line-height: 1.5; }
  #controls { position: fixed; z-index: 50; top: 16px; left: 16px; width: 420px; max-height: calc(100vh - 32px); overflow: auto; padding: 20px; border: 1px solid rgba(255,255,255,.13); border-radius: 14px; background: rgba(19, 21, 29, .94); box-shadow: 0 12px 36px rgba(0,0,0,.35); backdrop-filter: blur(12px); transform-origin: top left; transform: scale(var(--ui-scale, 1)); }
  #controls h1 { margin: 0 0 12px; font-size: 21px; }
  .field { margin: 12px 0; }
  label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; color: #bdc3d1; font-size: 15px; }
  select, button { width: 100%; border: 1px solid #3a3e4d; border-radius: 8px; padding: 11px 12px; background: #252936; color: #fff; font-size: 16px; }
  button { cursor: pointer; border-color: transparent; background: #168b7b; font-weight: 700; }
  button.secondary { margin-top: 7px; border-color: #3a3e4d; background: #252936; }
  input[type=range] { width: 100%; height: 22px; accent-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .checks { display: flex; align-items: center; gap: 16px; color: #bdc3d1; font-size: 15px; }
  .checks label { align-items: center; justify-content: flex-start; margin: 0; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  input[type=text] { width: 100%; padding: 11px 12px; border: 1px solid #3a3e4d; border-radius: 8px; background: #252936; color: #fff; font-size: 15px; }
  #camera-frame.hooked { animation: camera-hooked .72s ease-in-out 1; }
  @keyframes camera-hooked { 0%,100% { translate: 0 0; scale: 1; } 18% { translate: 9px -4px; scale: 1.025; } 38% { translate: -13px 7px; scale: .98; } 58% { translate: 14px 2px; scale: 1.025; } 78% { translate: -7px -3px; scale: 1.01; } }
  #status { min-height: 16px; margin-top: 9px; color: #a8b0c1; font-size: 14px; line-height: 1.4; }
  #settings-toggle { display: none; position: fixed; z-index: 50; right: 16px; bottom: 16px; width: auto; padding: 12px 18px; font-size: 16px; background: rgba(19, 21, 29, .92); border: 1px solid rgba(255,255,255,.2); transform-origin: bottom right; transform: scale(var(--ui-scale, 1)); }
  /* ─── Секции панели: сворачиваемые блоки ─── */
  #controls .sect { border: 1px solid rgba(255,255,255,.09); border-radius: 10px; margin: 10px 0; overflow: hidden; }
  #controls .sect > .sect-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; cursor: pointer; user-select: none; background: rgba(255,255,255,.045); font-size: 16px; font-weight: 700; }
  #controls .sect > .sect-head:hover { background: rgba(255,255,255,.09); }
  #controls .sect > .sect-head .arrow { transition: transform .2s; font-size: 14px; color: #8f97a8; }
  #controls .sect.open > .sect-head .arrow { transform: rotate(180deg); }
  #controls .sect > .sect-body { display: none; padding: 4px 14px 12px; }
  #controls .sect.open > .sect-body { display: block; }
  /* Живое превью камеры в шапке панели */
  #cam-preview { width: 92px; height: 52px; border-radius: 8px; object-fit: cover; background: #101219; border: 1px solid rgba(255,255,255,.14); display: block; transform: scaleX(var(--mirror, -1)); filter: var(--video-filter, none); }
  body.no-controls #controls, body.no-controls #placeholder { display: none; }
  body.no-controls #settings-toggle { display: block; }
</style>

<body>
<div id="container">
<div id="stage"><div id="camera-frame" class="rounded"><video id="video" autoplay playsinline muted></video><div id="placeholder">Нажмите «Включить камеру» и выберите устройство. Для OBS сначала настройте камеру и эффекты, затем откройте адрес с <b>?controls=0</b>.</div></div></div>

<div id="hook-layer" aria-hidden="true"><div id="hook3d"></div></div>
</div><!-- /container -->
<script>
// Вписываем контейнер 1080×1920 в окно источника с сохранением пропорций 9:16
// и масштабируем панель настроек, чтобы она была читаемой при любом размере источника
function fitContainer() {
  const c = document.getElementById('container');
  const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  c.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  // Панель: масштаб относительно «эталонного» окна 1280×720. В окне 1920×1080 — ~1.6×,
  // в маленьком превью — меньше 1. При этом панель не вылезает за экран.
  const uiScale = Math.max(0.8, Math.min(3, (window.innerHeight / 720) * 1.15));
  document.documentElement.style.setProperty('--ui-scale', uiScale.toFixed(3));
}
window.addEventListener('resize', fitContainer);
fitContainer();
</script>
<section id="controls" aria-label="Настройки веб-камеры">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
    <video id="cam-preview" autoplay playsinline muted></video>
    <div>
      <h1 style="margin:0;font-size:20px">📷 Камера + Хук</h1>
      <div id="status" role="status" style="margin-top:2px"></div>
    </div>
  </div>
  <div class="sect open" id="sect-cam">
    <div class="sect-head" data-sect="sect-cam"><span>🎥 Веб-камера</span><span class="arrow">▾</span></div>
    <div class="sect-body">
      <div class="field"><label for="camera">Устройство</label><select id="camera"><option value="">Сначала включите камеру</option></select></div>
      <button id="start">Включить камеру</button>
      <div class="field" style="margin-top:10px"><label for="preset">Эффект</label><select id="preset"><option value="none">Без эффекта</option><option value="cinema">Кино — контраст и насыщенность</option><option value="mono">Чёрно-белый</option><option value="warm">Тёплый</option><option value="cool">Холодный</option><option value="vivid">Яркий</option></select></div>
      <div class="field"><label for="brightness">Яркость <span id="brightness-value">100%</span></label><input id="brightness" type="range" min="50" max="160" value="100"></div>
      <div class="field"><label for="contrast">Контраст <span id="contrast-value">100%</span></label><input id="contrast" type="range" min="50" max="180" value="100"></div>
      <div class="row"><div class="field"><label for="shape">Форма</label><select id="shape"><option value="rounded">Скруглённая</option><option value="square">Квадратная</option><option value="circle">Круглая</option></select></div><div class="field"><label for="border">Рамка</label><select id="border"><option value="0">Нет</option><option value="2">2 px</option><option value="4">4 px</option><option value="8">8 px</option></select></div></div>
      <div class="field"><label for="glow">Свечение <span id="glow-value">0 px</span></label><input id="glow" type="range" min="0" max="40" value="0"></div>
      <div class="checks"><label><input id="mirror" type="checkbox" checked> Зеркально</label></div>
      <button id="stop" class="secondary" style="margin-top:8px">Выключить камеру</button>
    </div>
  </div>
  <div class="sect open" id="sect-hook">
    <div class="sect-head" data-sect="sect-hook"><span>🪝 Хук и цепь</span><span class="arrow">▾</span></div>
    <div class="sect-body">
      <button id="hook-test">🪝 Тест: Пудж хукает</button>
      <div class="field" style="margin-top:10px"><label for="gift-trigger">Подарок, запускающий хук</label><input id="gift-trigger" type="text" placeholder="Например: Rose / Роза"><label style="margin-top:4px;font-size:12px">Совпадение по части названия; пусто — отключено</label></div>
      <div class="field"><label>Позиция X <span id="hookx-value">0</span></label><input id="hook-x" type="range" min="-540" max="540" value="0"></div>
      <div class="field"><label>Позиция Y <span id="hooky-value">0</span></label><input id="hook-y" type="range" min="-960" max="960" value="0"></div>
      <div class="field"><label>Размер <span id="hooksize-value">100%</span></label><input id="hook-size" type="range" min="30" max="250" value="100"></div>
      <div class="field"><label>Цепь: свис <span id="hooksag-value">60%</span></label><input id="hook-sag" type="range" min="0" max="200" value="60"></div>
    </div>
  </div>
  <div class="checks" style="margin-top:10px"><label><input id="hide-ui" type="checkbox"> Скрыть настройки</label></div>
</section>
<button id="settings-toggle" type="button">⚙ Настройки</button>

<script>
(() => {
  const $=id=>document.getElementById(id),video=$('video'),camera=$('camera'),frame=$('camera-frame'),status=$('status'),query=new URLSearchParams(location.search),storageKey='dota2obs.webcam.settings';
  const filters={none:'',cinema:'saturate(1.18) contrast(1.12)',mono:'grayscale(1) contrast(1.08)',warm:'sepia(.22) saturate(1.2)',cool:'hue-rotate(12deg) saturate(.92)',vivid:'saturate(1.55) contrast(1.08)'};
  let settings={},stream=null,cameraRequested=false,hookTimer=0;try{settings=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(_){}
  cameraRequested=settings.cameraEnabled===true||query.get('controls')==='0';if(settings.hideUi||query.get('controls')==='0'){document.body.classList.add('no-controls');const hu=$('hide-ui');if(hu)hu.checked=true}
  function save(){try{localStorage.setItem(storageKey,JSON.stringify({cameraId:camera?.value||'',cameraEnabled:cameraRequested,hideUi:document.body.classList.contains('no-controls'),preset:$('preset')?.value||'',brightness:$('brightness')?.value||'',contrast:$('contrast')?.value||'',shape:$('shape')?.value||'',border:$('border')?.value||'',glow:$('glow')?.value||'',mirror:$('mirror')?.checked||false,giftTrigger:$('gift-trigger')?.value||'',hookX:+($('hook-x')?.value??0),hookY:+($('hook-y')?.value??0),hookSize:+($('hook-size')?.value??100),hookSag:+($('hook-sag')?.value??60)}))}catch(_){}}
  function applySettings(){if(!$('preset')||!$('brightness')||!$('contrast')||!video)return;video.style.setProperty('--video-filter',[filters[$('preset').value],`brightness(${$('brightness').value}%)`,`contrast(${$('contrast').value}%)`].filter(Boolean).join(' '));video.style.setProperty('--mirror',$('mirror')?.checked?'-1':'1');frame.className=$('shape').value;frame.style.setProperty('--border-width',$('border').value+'px');frame.style.setProperty('--glow',$('glow').value+'px');$('brightness-value').textContent=$('brightness').value+'%';$('contrast-value').textContent=$('contrast').value+'%';$('glow-value').textContent=$('glow').value+' px';save()}
  function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;const pv=$('cam-preview');if(pv)pv.srcObject=null;$('placeholder').style.display='grid'}
  function setStatus(message){if(status)status.textContent=message;else console.info('[webcam overlay]',message)}
  function playHook(){const layer=$('hook-layer');if(!layer){setStatus('Хук слой не найден');return}if(typeof window.__pudgeHookPlay==='function'){window.__pudgeHookPlay();setStatus('Запущен хук Пуджа из Dota 2!');return}window.__pudgeHookPending=true;setStatus('Ожидаю инициализацию хука...');}
  function isHookGift(name){const trigger=$('gift-trigger').value.trim().toLocaleLowerCase('ru');return !!trigger&&String(name||'').trim().toLocaleLowerCase('ru').includes(trigger)}
  const giftChannel=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('tiktok_gifts'):null;if(giftChannel)giftChannel.onmessage=e=>{const d=e.data||{};if(isHookGift(d.gift||d.giftName||d.name))playHook()};window.addEventListener('storage',e=>{if(e.key==='dota2obs:pudge-hook'&&e.newValue)try{const d=JSON.parse(e.newValue);if(Date.now()-d.at<5000&&isHookGift(d.gift))playHook()}catch(_){}});
  async function refreshDevices(){if(!navigator.mediaDevices?.enumerateDevices)return;const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'),selected=camera.value||settings.cameraId||'';camera.replaceChildren();devices.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||`Камера ${i+1}`;camera.append(o)});if(!devices.length){const o=document.createElement('option');o.textContent='Камеры не найдены';camera.append(o)}if([...camera.options].some(o=>o.value===selected))camera.value=selected}
  async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){setStatus('Доступ к камере недоступен в этом контексте.');return}stopCamera();setStatus('Запрашиваю доступ к камере…');try{const opts=camera.value?{deviceId:{exact:camera.value}}:{width:{ideal:1280},height:{ideal:720}};stream=await navigator.mediaDevices.getUserMedia({video:opts,audio:false});video.srcObject=stream;const pv=$('cam-preview');if(pv)pv.srcObject=stream;$('placeholder').style.display='none';await refreshDevices();cameraRequested=true;setStatus('Камера подключена.');save()}catch(e){setStatus(`Ошибка камеры: ${e.message}`)}}
  window.addEventListener('DOMContentLoaded',()=>{
    console.log('[webcam] Elements found:', {
      start: !!$('start'), stop: !!$('stop'), hookTest: !!$('hook-test'),
      settingsToggle: !!$('settings-toggle'), controls: !!$('controls'),
      video: !!$('video'), camera: !!$('camera'), status: !!$('status')
    });
    for(const id of ['preset','brightness','contrast','shape','border','glow','mirror'])$(id)?.addEventListener('input',applySettings);
    const startBtn=$('start');
    if(startBtn){startBtn.addEventListener('click',()=>{console.log('[webcam] Start camera clicked');startCamera()});}else{console.error('[webcam] start button NOT FOUND');}
    const stopBtn=$('stop');
    if(stopBtn){stopBtn.addEventListener('click',()=>{console.log('[webcam] Stop camera clicked');cameraRequested=false;stopCamera();save();setStatus('Камера выключена')});}else{console.error('[webcam] stop button NOT FOUND');}
    const hookTestBtn=$('hook-test');
    if(hookTestBtn){hookTestBtn.addEventListener('click',()=>{console.log('[webcam] Hook test clicked');playHook()});}else{console.error('[webcam] hook-test button NOT FOUND');}
    $('gift-trigger')?.addEventListener('input',save);
    camera?.addEventListener('change',()=>{save();if(stream)startCamera()});
    $('hide-ui')?.addEventListener('change',e=>{document.body.classList.toggle('no-controls',e.target.checked);save()});
    const settingsToggle=$('settings-toggle');
    if(settingsToggle){
      settingsToggle.addEventListener('click',()=>{
        document.body.classList.remove('no-controls');
        $('hide-ui').checked=false;
        save();
      });
    }else{console.error('[webcam] settings-toggle NOT FOUND');}
    for(const id of ['preset','brightness','contrast','shape','border','glow'])if(settings[id]!=null)$(id).value=settings[id];
    if(settings.mirror!=null)$('mirror').checked=settings.mirror;
    if(settings.giftTrigger)$('gift-trigger').value=settings.giftTrigger;
    applySettings();
    refreshDevices().catch(()=>{});
    if(cameraRequested){console.log('[webcam] Auto-starting camera');startCamera();}
    // Хук: позиция/размер — обновление window.__hookSettings и подписи
    function syncHookSettings(){window.__hookSettings={hookX:+($('hook-x')?.value??0),hookY:+($('hook-y')?.value??0),hookSize:+($('hook-size')?.value??100),hookSag:+($('hook-sag')?.value??60)};const xv=$('hookx-value'),yv=$('hooky-value'),sv=$('hooksize-value');if(xv)xv.textContent=window.__hookSettings.hookX;if(yv)yv.textContent=window.__hookSettings.hookY;if(sv)sv.textContent=window.__hookSettings.hookSize+'%';window.__pudgeHookSetSag&&window.__pudgeHookSetSag(window.__hookSettings.hookSag/100)}
    ['hook-x','hook-y','hook-size','hook-sag'].forEach(id=>$(id)?.addEventListener('input',()=>{syncHookSettings();save()}));
    ['hook-x','hook-y','hook-size','hook-sag'].forEach(id=>{if(settings[id]!=null&&$(id))$(id).value=settings[id]});
    syncHookSettings();
    // Секции-аккордеоны: клик по заголовку сворачивает/разворачивает
    document.querySelectorAll('#controls .sect > .sect-head').forEach(h => h.addEventListener('click', () => h.parentElement.classList.toggle('open')));
  });
})();
</script>

// Ручной парсер GLB -> THREE.BufferGeometry (без GLTFLoader и importmap).
// Достаточно для нашей модели: один меш, атрибуты POSITION/NORMAL/TEXCOORD_0/JOINTS_0/WEIGHTS_0 + индексы.
window.parseGLB = function (arrayBuffer, THREE) {
  const data = new DataView(arrayBuffer);
  let off = 0;
  const magic = data.getUint32(off, true); off += 4;
  if (magic !== 0x46546C67) throw new Error('not glb');

  const total = data.getUint32(off, true); off += 4;

  const mesh = new THREE.Mesh(geo, mat);
  const scene = new THREE.Group();
  scene.add(mesh);
  return { scene, json };
};

<script type="module">
new Function(document.getElementById('three-data').textContent)();

(async () => {
  const container = document.getElementById('hook3d');
  const layer = document.getElementById('hook-layer');
  if (!container) return;

  // ---------- сцена ----------
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  // Супер-сэмплинг: рендерим в 2.5× разрешении буфера — при масштабировании контейнера
  // и выводе в OBS контуры крюка/цепи остаются резкими. OBS DPR часто = 1,
  // поэтому фиксируем высокий pixelRatio вместо доверия window.devicePixelRatio.
  renderer.setPixelRatio(Math.max(2, window.devicePixelRatio || 1) * 1.25);
  container.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.position.set(0, 0, 10);
  scene.add(new THREE.AmbientLight(0xffffff, 2.6));
  const key = new THREE.DirectionalLight(0xffffff, 3.8); key.position.set(4, 6, 10); scene.add(key);
  const key2 = new THREE.DirectionalLight(0xfff2e8, 2.6); key2.position.set(-6, -3, 8); scene.add(key2);
  const rim = new THREE.DirectionalLight(0xffd9b0, 1.5); rim.position.set(-4, -2, -3); scene.add(rim);

  // ---------- настоящая модель Dota 2 (righthook.glb), ручной GLB-парсер ----------
  // GLB вшит в HTML ниже (BASE64_GLB), чтобы не зависеть от file:// CORS
  const b64 = document.getElementById('glb-data').textContent.trim();
  const binStr = atob(b64);
  const buf = new ArrayBuffer(binStr.length);
  const u8 = new Uint8Array(buf);
  for (let i = 0; i < binStr.length; i++) u8[i] = binStr.charCodeAt(i);
  const parsed = window.parseGLB(buf, THREE);
  const hookGroup = parsed.scene;
  const mesh = hookGroup.children[0];
  // Резкость текстуры: анизотропная фильтрация (макс. доступная) — текстура не мылится под наклоном
  if (mesh.material && mesh.material.map) {
    mesh.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
    mesh.material.map.minFilter = THREE.LinearMipmapLinearFilter;
    mesh.material.map.needsUpdate = true;
  }
  // длинная ось модели — Z; укладываем её горизонтально, остриём (+Z) влево,
  // и доворачиваем вокруг продольной оси (roll), чтобы дуга крюка смотрела ВВЕРХ, а не вбок
  mesh.rotation.y = -Math.PI / 2;
  mesh.rotation.z = -Math.PI / 2;
  mesh.updateMatrixWorld(true);

  // ---------- ���� �������� ����: ������ �������� ��� �����, ���������� �� ��� Z.
  // ����� �������� ��� ����������� �� ������ ������� �� X � �������� ��� ��� ����.
  // ������� ������� ����� (������/���������, Z < -0.5), ��������� ������ �������� ����� ����.

  const keep = new Array(vcount).fill(true);
  for (let i = 0; i < vcount; i++) {
    if (positions[i * 3 + 2] < -0.5) keep[i] = false;
  }
  const oldToNew = new Int32Array(vcount);
  let newCount = 0;
  for (let i = 0; i < vcount; i++) {
    if (keep[i]) oldToNew[i] = newCount++;
  }
  const copyAttr = (name, comps) => {
    const attr = mesh.geometry.attributes[name];
    if (!attr) return null;
    const arr = attr.array;
    const Typed = arr.constructor;
    const newArr = new Typed(newCount * comps);
    let ni = 0;
    for (let i = 0; i < vcount; i++) {
      if (!keep[i]) continue;
      const oi = oldToNew[i];
      for (let c = 0; c < comps; c++) newArr[ni * comps + c] = arr[i * comps + c];
      ni++;
    }
    return new THREE.BufferAttribute(newArr, comps);
  };
  const idxAttr = mesh.geometry.index;
  const indices = idxAttr.array;
  const idxCount = idxAttr.count;
  const newIndices = [];
  for (let t = 0; t < idxCount; t += 3) {

  // нормализация: замер ПОСЛЕ поворота — по фактической геометрии
  const bbox = new THREE.Box3().setFromObject(mesh);
  const size = bbox.getSize(new THREE.Vector3()), center = bbox.getCenter(new THREE.Vector3());
  const normScale = 3.4 / Math.max(size.x, size.y, size.z);
  mesh.position.set(-center.x, -center.y, -center.z);   // центр модели в начале координат обёртки

  hookGroup.position.set(0, 0, 0);
  hookGroup.rotation.set(0, 0, 0);

  const tipX  = localBox.min.x;   // остриё (слева)

  scene.add(hookGroup);
  layer.appendChild(renderer.domElement);

  // размер канваса под слой
  function resize() {
    const w = layer.clientWidth || window.innerWidth, h = layer.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();

    renderer.domElement.style.position = 'absolute'; renderer.domElement.style.inset = '0';
    renderer.setPixelRatio(Math.max(2, window.devicePixelRatio || 1) * 1.25); // удерживаем супер-сэмплинг после resize
  }
  resize(); new ResizeObserver(resize).observe(layer);

  // показываем только во время анимации hook-fly
  let visible = false;
  new MutationObserver(() => {
    const on = layer.classList.contains('active');
    if (on !== visible) { visible = on; renderer.domElement.style.display = on ? 'block' : 'none'; }
  }).observe(layer, { attributes: true, attributeFilter: ['class'] });
  renderer.domElement.style.display = 'none';

  // ---------- цепь: child hookGroup, от кольца наружу вправо ----------
  // ВАЖНО: позиции детей hookGroup умножаются на normScale — задаём их в ДО-масштабных единицах модели.
  // После центровки модель занимает ±size/2: кольцо на +size.x/2, остриё на -size.x/2.
  const chainGroup = new THREE.Group();
   const linkGeo = new THREE.TorusGeometry(0.06, 0.020, 14, 32); // больше сегментов = круглее звено
   // Свет в сцене очень яркий (подсвечивает тёмный крюк) — берём почти чёрный базовый цвет,
   // иначе цепь пересвечивается до белого. Металлический блеск минимальный.
   const chainMat = new THREE.MeshStandardMaterial({ color: 0x0a0b0d, metalness: 0.3, roughness: 0.6, emissive: new THREE.Color(0x060708) });
   // Цепь тянется от кольца хука ЗА ПРАВЫЙ КРАЙ ЭКРАНА: длина с запасом,
   // чтобы при любом положении хука (в т.ч. в центре) конец уходил за экран.
   const CHAIN_WORLD = 14;                       // мировых единиц за кольцом — заведомо за экраном
   const ringLocal = size.x / 2;
   const chainLenLocal = CHAIN_WORLD / normScale; // переводим в до-масштабные единицы модели
   const step = 0.11;   // чуть меньше диаметра звена — звенья внахлёст
   const LINKS = Math.ceil(chainLenLocal / step);
   const SAG_BASE = 0.6;
   let sag = SAG_BASE;
   for (let i = 0; i < LINKS; i++) {
     const t = i / (LINKS - 1);
     const x = ringLocal + 0.02 + i * step;
     const y = -sag * (t * t) + (i % 2 ? 0.015 : -0.015);
     const z = Math.sin(t * Math.PI * 2.5) * 0.05;
     const m = new THREE.Mesh(linkGeo, chainMat);
     m.position.set(x, y, z);
     m.userData.t = t; m.userData.i = i;
     // У настоящей цепи отверстие звена перпендикулярно цепи; соседние звенья
     // повёрнуты на 90° друг к другу (ось отверстия: Z → Y → Z → Y…)
     if (i % 2) m.rotation.x = Math.PI / 2; // ось отверстия: Z → Y
     chainGroup.add(m);
   }
   // kurze Kette ohne zusatzliche �����
   hookGroup.add(chainGroup);
   // Свис цепи управляется слайдером hook-sag (window.__pudgeHookSetSag)
   function applySag(sv) {
     sag = sv;
     chainGroup.children.forEach(m => {
       m.position.y = -sag * (m.userData.t * m.userData.t) + (m.userData.i % 2 ? 0.015 : -0.015);
     });
   }
   applySag(SAG_BASE);
   window.__pudgeHookSetSag = applySag;
 

  // ---------- анимация: полёт, вращение, попадание в центр ----------
  let t0 = 0;
  function play() {
    const layerEl = layer;
    t0 = performance.now();
    const frameEl = document.getElementById('camera-frame');
    layerEl.classList.add('active');
    frameEl.classList.remove('hooked');
    void frameEl.offsetWidth;
    frameEl.classList.add('hooked');
    clearTimeout(play._timer);
    play._timer = setTimeout(() => {
      layerEl.classList.remove('active');
      frameEl.classList.remove('hooked');
    }, 1900);
  }
  window.__pudgeHookPlay = play;
  const urlParams = new URLSearchParams(location.search);
  if (urlParams.has('diag')) {
    document.documentElement.dataset.diag = '1';
    document.documentElement.dataset.diagRz = urlParams.get('rz') || '0';
    layer.classList.add('active');
    visible = true;
    renderer.domElement.style.display = 'block';
  }
  if (window.__pudgeHookPending) { window.__pudgeHookPending = false; play(); }

  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    if (document.documentElement.dataset.diag === '1') {  // диагностический кадр: модель в центре
      hookGroup.position.set(0, 0, 0);
      hookGroup.rotation.set(0, 0, parseFloat(document.documentElement.dataset.diagRz || '0'));
      hookGroup.updateMatrixWorld(true);
      const db = new THREE.Box3().setFromObject(hookGroup);
      document.title = 'DBG ' + [db.min.x, db.max.x, db.min.y, db.max.y].map(v => v.toFixed(1)).join(' ');
      renderer.render(scene, camera);
      return;
    }
    const t = visible ? Math.min((now - t0) / 1800, 1) : 0;
    // 0..0.46 — прилетает из-за правого края, пауза в центре 0.46-0.56, уходит обратно
    const s = t < 0.5 ? (t / 0.46) : (1 - t) / 0.44;
    const swing = Math.min(Math.max(s, 0), 1);
    const eased = swing * (3 - 2 * swing);
    // База: остриё уже слева после укладки модели. Качание вокруг вертикали — видно обе стороны.
    // Тряска рамки — один короткий импульс (было ×2 — выглядело как вторая дёргающаяся копия)
    hookGroup.rotation.set(0, Math.sin(now * 0.0006) * 0.06, -(0.05 - eased * 0.10));
    hookGroup.updateMatrixWorld(true);
    // Полёт справа: остриё (мировой min.x = pos.x + tipX) приходит точно в центр.
    // Y фиксируем нулём: модель отцентрирована при укладке. Пересчёт Box3 каждый кадр
    // (включая провисающую цепь) давал дрожь — убран.
    // Пользовательские настройки хука: позиция X/Y (пиксели контейнера 1080×1920) и размер
    const HS = window.__hookSettings || {};
    const hx = (HS.hookX || 0) / 100;      // контейнер 1080px ≈ 10 мировых единиц ширины кадра
    const hy = -(HS.hookY || 0) / 100;     // Y инвертирован: слайдер вправо = ниже
    const hs = (HS.hookSize || 100) / 100; // масштаб хука
    hookGroup.scale.setScalar(normScale * hs);
    // Полёт справа: остриё приходит в центр, затем смещаем на пользовательскую позицию
    hookGroup.position.x = -tipX + (1 - eased) * 16 + hx;
    hookGroup.position.y = hy;
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
