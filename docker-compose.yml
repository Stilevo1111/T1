version: '3.8'

services:
  fissure-bot:
    build: .
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///fissure_bot.db}
      - RENDER_EXTERNAL_URL=${RENDER_EXTERNAL_URL}
      - PORT=${PORT:-10000}
    volumes:
      - ./fissure_bot.db:/app/fissure_bot.db
      - ./logs:/app/logs
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.append('.'); from config import validate_config; exit(0 if validate_config() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s